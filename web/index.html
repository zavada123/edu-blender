<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D-моделювання онлайн: уроки Blender у браузері · Едупростір</title>
    <meta name="description" content="Безкоштовні уроки 3D-моделювання для школярів у справжньому Blender просто в браузері: сцена й фігури, копії, режим редагування, матеріали, камера й рендер, анімація. Без встановлення." />
    <!-- GitHub Pages не вміє ставити заголовки COOP/COEP; цей service worker додає їх і перезавантажує сторінку один раз. -->
    <script src="coi-serviceworker.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="splash" aria-live="polite">
      <main class="stage">
        <div id="splash-shell" class="stage-inner" data-phase="loading">
          <h1 class="splash-title">Едупростір: уроки 3D</h1>
          <p class="project-copy">Справжній Blender просто в браузері. Інструменти відкриваються крок за кроком.</p>

          <nav id="lesson-list" class="lesson-list" hidden></nav>
          <p id="lesson-title" class="lesson-title" hidden></p>

          <div id="stage-card" class="launch-panel" data-phase="loading">
            <div class="panel-loading" aria-label="Завантаження Blender">
              <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
              <div class="progress-meta">
                <span id="progress-phase">Підготовка</span>
                <span id="progress-percent"></span>
              </div>
              <p id="splash-status" class="splash-status">Завантажуємо Blender (близько 65 МБ, далі з кешу)…</p>
            </div>
            <div class="panel-ready" aria-label="Запуск">
              <button id="start-btn" type="button" class="start-btn">Почати урок</button>
              <p id="webgpu-note" class="note" hidden></p>
            </div>
            <div id="gpu-warning" class="gpu-warning" hidden>
              <p id="gpu-warning-text" class="gpu-warning-text"></p>
              <label id="gpu-ack-row" class="gpu-ack-row" hidden>
                <input type="checkbox" id="gpu-ack" />
                <span>Запустити без відеокарти (буде дуже повільно).</span>
              </label>
            </div>
          </div>

          <details class="startup-console">
            <summary>Журнал запуску</summary>
            <div id="console-output" class="console-box" role="log"></div>
          </details>
          <p class="credits">
            Blender — GPL, збірка для браузера:
            <a href="https://github.com/heyputer/blender-wasm" target="_blank" rel="noreferrer">heyputer/blender-wasm</a>.
          </p>
        </div>
      </main>
    </section>
    <canvas id="canvas" width="1536" height="864" tabindex="0"></canvas>
    <div id="edu-progress" class="edu-progress" hidden></div>
    <section id="edu-finish" class="edu-finish" role="status" hidden>
      <p class="edu-finish-title">Урок завершено!</p>
      <p id="edu-finish-text" class="edu-finish-text"></p>
      <div class="edu-finish-actions">
        <a id="edu-finish-next" class="edu-finish-btn" href="./" hidden>Наступний урок</a>
        <a class="edu-finish-btn secondary" href="./">Усі уроки</a>
      </div>
    </section>
    <script src="browser-guard.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
